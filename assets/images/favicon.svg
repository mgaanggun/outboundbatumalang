<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="frontMountain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="8"/>

  <!-- Morning Sunrise over Mt Arjuno / Panderman -->
  <circle cx="360" cy="170" r="68" fill="url(#sunGrad)" filter="url(#glow)"/>

  <!-- Back Mountain Peak -->
  <polygon points="120,400 270,170 380,400" fill="url(#primaryGrad)" opacity="0.85"/>
  <polygon points="270,170 230,230 270,250 300,225" fill="#E0F2FE" opacity="0.9"/>

  <!-- Front Mountain Peak (Batu Highland) -->
  <polygon points="200,400 360,220 480,400" fill="url(#frontMountain)"/>
  <polygon points="360,220 330,270 365,285 390,265" fill="#FFFFFF" opacity="0.95"/>

  <!-- Pine / Nature Accent in Foreground -->
  <path d="M70,400 L250,400 C220,380 180,365 140,365 C100,365 80,385 70,400 Z" fill="#10B981" opacity="0.9"/>
  <circle cx="140" cy="380" r="16" fill="#34D399"/>
</svg>
